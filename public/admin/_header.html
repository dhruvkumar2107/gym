    <style>
      .popular-plan{position:relative;border:2px solid #c7a44e!important}
      .popular-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#c7a44e;color:#fff;padding:4px 20px;border-radius:20px;font-size:12px;font-weight:700;z-index:2}
      .original-price{text-decoration:line-through;color:#999;font-size:14px}
      .plan-price{font-size:28px;font-weight:700;color:#c7a44e}
      .plan-total{font-size:14px;color:#999;font-weight:400}
      .schedule-item{padding:8px;margin:4px 0;background:#f8f9fa;border-radius:6px;border-left:3px solid #c7a44e}
      .schedule-table th{background:#1a1a2e;color:#c7a44e;text-align:center}
      .schedule-table td{vertical-align:top;min-width:120px}
      .trainer-name{color:#c7a44e;font-size:11px}
      .team-member{position:relative;overflow:hidden}
      .team-img{overflow:hidden;border-radius:8px}
      .team-img img{width:100%;transition:transform 0.3s}
      .team-member:hover .team-img img{transform:scale(1.05)}
      .team-social a{display:inline-block;margin:0 5px;color:#c7a44e;font-size:16px}
      .single-facility{text-align:center;padding:30px;background:#1a1a2e;border-radius:10px;transition:transform 0.3s}
      .single-facility:hover{transform:translateY(-5px)}
      .facility-icon{font-size:40px;color:#c7a44e;margin-bottom:15px}
      .blog-date{font-size:12px;color:#999}
      .testimonail-item{padding:20px;margin:10px 0}
      .rating i{color:#c7a44e}
      .section-padding40{padding:40px 0}
      .gallery-popup{cursor:pointer}
      .gallery-item{transition:opacity 0.3s}
      .workout-card{background:#1a1a2e;border-radius:10px;padding:20px;margin-bottom:15px}
      .workout-card h4{color:#c7a44e;margin-bottom:10px}
      .workout-meta span{display:inline-block;margin-right:15px;font-size:13px;color:#999}
      .calc-form label{color:#c7a44e;display:block;margin-bottom:5px}
      .calc-form input,.calc-form select{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:5px;background:#fff}
      .calc-result{background:#1a1a2e;color:#fff;padding:20px;border-radius:10px;margin-top:20px}
      .calc-result h3{color:#c7a44e}
      .faq-section .accordion .card{background:#1a1a2e;border:1px solid #333;margin-bottom:10px;border-radius:8px}
      .faq-section .accordion .card-header{background:transparent;border:none;padding:15px 20px}
      .faq-section .accordion .card-header h5{margin:0}
      .faq-section .accordion .card-header button{color:#c7a44e;text-decoration:none;background:none;border:none;width:100%;text-align:left;font-size:16px}
      .faq-section .accordion .card-body{color:#ccc;padding:0 20px 15px}
      .class-card{background:#1a1a2e;border-radius:10px;overflow:hidden;margin-bottom:20px}
      .class-card .class-img{height:200px;background-size:cover;background-position:center}
      .class-card .class-info{padding:20px}
      .class-card h4{color:#c7a44e}
      .class-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
      .badge-beginner{background:#27ae60;color:#fff}
      .badge-intermediate{background:#f39c12;color:#fff}
      .badge-advanced{background:#e74c3c;color:#fff}
      .badge-all-levels{background:#3498db;color:#fff}
    </style>
